<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentry</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8e8;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  main{max-width:360px;padding:24px}
  a.btn{display:block;margin:10px 0;padding:14px;border-radius:12px;text-decoration:none;font-weight:bold}
  .p{background:#3b82f6;color:#fff}.s{border:1px solid #444;color:#ddd}
  small{color:#999;word-break:break-all}
</style>
</head>
<body>
<main>
  <h2>Sentry</h2>
  <p id="msg">تطبيق Sentry</p>
  <a class="btn p" id="open" href="#">فتح في التطبيق</a>
  <a class="btn s" id="dl" href="https://github.com/nt18s-max/Sentry-app-updates/releases/latest">تحميل التطبيق</a>
  <p id="arch" style="font-size:12px;color:#aaa;margin:0 0 8px"></p>
  <a id="other" href="#" style="font-size:12px;color:#8ab4ff;display:none">نسخة أخرى لمعمارية مختلفة</a>
  <small id="code"></small>
</main>
<script>
  // Paths look like /l/<v|g|o>/<code>. When the app is installed Android opens the app
  // itself (verified link); this page only shows when it is not, or on a desktop browser.
  var m = location.pathname.match(/^\/l\/([gov])\/([A-Za-z0-9_-]{4,64})/);
  var openApp = function (intent) {
    document.getElementById('open').href = intent;
    // Try the app once. Coming back from the fallback (#stay) shows the page and stops.
    if (/Android/i.test(navigator.userAgent) && location.hash !== '#stay') {
      setTimeout(function () { location.href = intent; }, 400);
    }
  };
  var back = location.origin + location.pathname + '#stay';
  if (!m) {
    // The plain site address: "open" just launches the app (sentry://open).
    openApp('intent://open#Intent;scheme=sentry;S.browser_fallback_url=' + encodeURIComponent(back) + ';end');
  } else {
    document.getElementById('code').textContent = m[2];
    // No `package=` on purpose: with it, a phone that lacks the app is sent to Google Play.
    // Without it, an unhandled link falls back to THIS page (S.browser_fallback_url) instead.
    openApp('intent://l/' + m[1] + '/' + m[2] + '#Intent;scheme=sentry;S.browser_fallback_url=' +
      encodeURIComponent(back) + ';end');
  }

  // Download button that picks the APK matching the phone's CPU. Chrome on Android tells the
  // architecture through userAgentData; older browsers through navigator.platform.
  // Unknown -> the 64-bit build first (most phones) and the other one one tap away.
  var BASE = 'https://github.com/nt18s-max/Sentry-app-updates/releases/download/latest/sentry-';
  var NAMES = {'arm64-v8a': '64 بت (arm64)', 'armeabi-v7a': '32 بت (armv7)'};
  function show(abi, sure) {
    var other = abi === 'arm64-v8a' ? 'armeabi-v7a' : 'arm64-v8a';
    var dl = document.getElementById('dl');
    dl.href = BASE + abi + '.apk';
    dl.textContent = 'تحميل التطبيق — ' + NAMES[abi];
    document.getElementById('arch').textContent = sure
      ? 'اخترنا النسخة المناسبة لجهازك.'
      : 'لم نستطع معرفة معمارية جهازك؛ جرّب هذه، وإن لم تثبّت فاستعمل النسخة الأخرى.';
    var o = document.getElementById('other');
    o.href = BASE + other + '.apk';
    o.textContent = 'نسخة ' + NAMES[other];
    o.style.display = 'inline';
  }
  function fromPlatform() {
    var p = (navigator.platform || '') + ' ' + (navigator.userAgent || '');
    if (/aarch64|armv81|arm64/i.test(p)) return 'arm64-v8a';
    if (/armv7|armv8l|armv6/i.test(p)) return 'armeabi-v7a';
    return null;
  }
  if (/Android/i.test(navigator.userAgent || '')) {
    var done = function (abi) { show(abi || 'arm64-v8a', !!abi); };
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      navigator.userAgentData.getHighEntropyValues(['architecture', 'bitness']).then(function (v) {
        var a = String(v.architecture || '').toLowerCase();
        if (a === 'arm') done(String(v.bitness) === '64' ? 'arm64-v8a' : 'armeabi-v7a');
        else done(fromPlatform());
      }, function () { done(fromPlatform()); });
    } else done(fromPlatform());
  }
</script>
</body>
</html>
